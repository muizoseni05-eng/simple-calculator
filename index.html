<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #171923; font-family: Arial, sans-serif; padding: 20px;
    }
    .calculator {
      width: 100%; max-width: 330px; background: #252a38;
      padding: 22px; border-radius: 18px; box-shadow: 0 12px 35px #0006;
    }
    h1 { color: white; font-size: 22px; margin: 0 0 16px; text-align: center; }
    #display {
      width: 100%; height: 65px; margin-bottom: 14px; padding: 10px;
      border: 0; border-radius: 10px; background: #10131b; color: white;
      font-size: 28px; text-align: right;
    }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    button {
      min-height: 58px; border: 0; border-radius: 10px;
      background: #3a4153; color: white; font-size: 20px;
    }
    button:active { opacity: .75; }
    .operator { background: #5267d8; }
    .clear { background: #b94b55; }
    .equals { background: #238b67; grid-row: span 2; }
    .zero { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>Simple Calculator</h1>
    <input id="display" aria-label="Calculator display" readonly>
    <div class="keys">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendOperator('/')">÷</button>
      <button class="operator" onclick="appendOperator('*')">×</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('-')">−</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('+')">+</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="equals" onclick="calculate()">=</button>

      <button class="zero" onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
    </div>
  </main>

  <script>
    const display = document.getElementById('display');
    let firstNumber = null;
    let operator = null;
    let startNewNumber = false;

    function appendNumber(number) {
      if (startNewNumber) {
        display.value = '';
        startNewNumber = false;
      }
      if (number === '.' && display.value.includes('.')) return;
      display.value += number;
    }

    function appendOperator(nextOperator) {
      if (display.value === '') return;
      if (firstNumber !== null && operator && !startNewNumber) calculate();
      firstNumber = Number(display.value);
      operator = nextOperator;
      startNewNumber = true;
    }

    function calculate() {
      if (firstNumber === null || !operator || display.value === '') return;
      const secondNumber = Number(display.value);
      let result;
      if (operator === '+') result = firstNumber + secondNumber;
      if (operator === '-') result = firstNumber - secondNumber;
      if (operator === '*') result = firstNumber * secondNumber;
      if (operator === '/') result = secondNumber === 0 ? 'Cannot divide by zero' : firstNumber / secondNumber;
      display.value = String(result);
      firstNumber = null;
      operator = null;
      startNewNumber = true;
    }

    function clearDisplay() {
      display.value = '';
      firstNumber = null;
      operator = null;
      startNewNumber = false;
    }

    function deleteLast() {
      if (startNewNumber) return;
      display.value = display.value.slice(0, -1);
    }
  </script>
</body>
</html>
